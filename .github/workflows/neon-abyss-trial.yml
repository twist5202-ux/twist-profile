name: Generate TWIST Neon Abyss V2 Trial Audio

on:
  push:
    branches:
      - feature/neon-abyss-v2-audio
    paths:
      - scripts/render-neon-abyss.py
      - .github/workflows/neon-abyss-trial.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sound synthesis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy imageio-ffmpeg
      - name: Render original deterministic Neon Abyss audio
        run: python scripts/render-neon-abyss.py
      - name: Encode for website
        run: |
          python -c 'import imageio_ffmpeg,subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),"-y","-v","error","-i","assets/twist-neon-abyss-v2.wav","-c:a","libmp3lame","-q:a","4","assets/twist-neon-abyss-v2.mp3"],check=True)'
          rm assets/twist-neon-abyss-v2.wav
          test -s assets/twist-neon-abyss-v2.mp3
      - name: Commit audio asset to this trial branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/twist-neon-abyss-v2.mp3
          git diff --cached --quiet || git commit -m "Render original Neon Abyss V2 MP3 for trial"
          git push origin HEAD:feature/neon-abyss-v2-audio
